<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Simple personal notes application">
  <title>Notes</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">
  <div class="app-container">
    <!-- Top Bar -->
    <header class="app-header">
      <div class="header-main">
        <div class="brand">
          <h1 class="brand-title">Notes</h1>
        </div>

        <div class="header-actions">
          <!-- Theme Toggle -->
          <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
            <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="search-box">
        <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Search notes..." autocomplete="off">
        <button id="clearSearchBtn" class="clear-search hidden" aria-label="Clear search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Category Filter Chips -->
      <div class="categories-scroll">
        <div class="category-chips" id="categoryChips">
          <button class="chip active" data-category="all">All</button>
          <button class="chip" data-category="Personal">Personal</button>
          <button class="chip" data-category="Work">Work</button>
          <button class="chip" data-category="Ideas">Ideas</button>
          <button class="chip" data-category="Study">Study</button>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="stats-bar">
        <span id="notesCountText" class="notes-count">1 note</span>
      </div>

      <!-- Notes Grid -->
      <div id="notesContainer" class="notes-grid">
        <!-- Notes are rendered dynamically here -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon-wrap">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <h3 id="emptyTitle">No notes</h3>
        <p id="emptySubtitle">Tap the button below to add your first note.</p>
        <button id="emptyAddBtn" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New Note
        </button>
      </div>
    </main>

    <!-- Floating Action Button -->
    <button id="addNoteFab" class="fab" aria-label="Add note" title="Add note">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <!-- Note Editor Modal -->
  <div id="noteModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">New Note</h2>
        <button id="closeModalBtn" class="icon-btn-sm" aria-label="Close modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <form id="noteForm" class="modal-form">
        <input type="hidden" id="noteId">

        <!-- Title -->
        <div class="form-group">
          <label for="noteTitleInput">Title</label>
          <input type="text" id="noteTitleInput" placeholder="Title" required maxlength="100">
        </div>

        <!-- Category & Tag Tone -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="noteCategorySelect">Category</label>
            <select id="noteCategorySelect">
              <option value="Personal">Personal</option>
              <option value="Work">Work</option>
              <option value="Ideas">Ideas</option>
              <option value="Study">Study</option>
            </select>
          </div>

          <div class="form-group flex-1">
            <label>Tag tone</label>
            <div class="color-picker" id="colorPicker">
              <button type="button" class="color-dot active" data-color="slate" style="background-color: #64748b;" title="Slate"></button>
              <button type="button" class="color-dot" data-color="blue" style="background-color: #2563eb;" title="Blue"></button>
              <button type="button" class="color-dot" data-color="teal" style="background-color: #0d9488;" title="Teal"></button>
              <button type="button" class="color-dot" data-color="amber" style="background-color: #d97706;" title="Amber"></button>
              <button type="button" class="color-dot" data-color="rose" style="background-color: #e11d48;" title="Rose"></button>
            </div>
          </div>
        </div>

        <!-- Content -->
        <div class="form-group">
          <label for="noteContentInput">Content</label>
          <textarea id="noteContentInput" rows="7" placeholder="Write your note here..." required></textarea>
        </div>

        <!-- Pin option -->
        <div class="form-checkbox">
          <label class="checkbox-container">
            <input type="checkbox" id="notePinnedInput">
            <span class="custom-checkbox"></span>
            <span class="checkbox-label">Pin to top</span>
          </label>
        </div>

        <!-- Actions -->
        <div class="modal-actions">
          <button type="button" id="cancelModalBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="saveNoteBtn" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Modal -->
  <div id="deleteModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card modal-confirm">
      <div class="confirm-icon-danger">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </div>
      <h3>Delete this note?</h3>
      <p>Are you sure you want to delete "<span id="deleteNoteTitlePreview" class="highlight-text"></span>"? This cannot be undone.</p>
      <div class="modal-actions">
        <button type="button" id="cancelDeleteBtn" class="btn btn-secondary">Cancel</button>
        <button type="button" id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- App Script -->
  <script src="js/app.js"></script>
</body>
</html>
