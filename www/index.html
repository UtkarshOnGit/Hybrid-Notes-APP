<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="NoteFlow - Modern Hybrid Note-Taking Application">
  <title>NoteFlow - Smart Hybrid Notes</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">
  <div class="app-container">
    <!-- Top App Bar -->
    <header class="app-header">
      <div class="header-main">
        <div class="brand">
          <div class="brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3z"/>
              <path d="M15 3v6h6"/>
              <path d="M10 18l4-4"/>
              <path d="M10 14l4 4"/>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">NoteFlow</h1>
            <p class="brand-subtitle">Hybrid Mobile Notes</p>
          </div>
        </div>

        <div class="header-actions">
          <!-- Theme Toggle -->
          <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle dark mode" title="Toggle Theme">
            <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Search notes by title or content..." autocomplete="off">
        <button id="clearSearchBtn" class="clear-search hidden" aria-label="Clear search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Category Filter Chips -->
      <div class="categories-scroll">
        <div class="category-chips" id="categoryChips">
          <button class="chip active" data-category="all">All</button>
          <button class="chip" data-category="Personal">Personal</button>
          <button class="chip" data-category="Work">Work</button>
          <button class="chip" data-category="Ideas">Ideas</button>
          <button class="chip" data-category="Study">Study</button>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Status & Stats Bar -->
      <div class="stats-bar">
        <span id="notesCountText" class="notes-count">Loading notes...</span>
        <div class="view-options">
          <span class="badge-hybrid">Hybrid Web & Android</span>
        </div>
      </div>

      <!-- Notes Container -->
      <div id="notesContainer" class="notes-grid">
        <!-- Notes will be dynamically injected here -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon-wrap">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="15" y2="15"></line>
          </svg>
        </div>
        <h3 id="emptyTitle">No notes yet</h3>
        <p id="emptySubtitle">Tap the + button below to create your very first note.</p>
        <button id="emptyAddBtn" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Create Note
        </button>
      </div>
    </main>

    <!-- Floating Action Button (FAB) -->
    <button id="addNoteFab" class="fab" aria-label="Create note" title="Create note">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <!-- Note Editor Modal -->
  <div id="noteModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">Create Note</h2>
        <button id="closeModalBtn" class="icon-btn-sm" aria-label="Close modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <form id="noteForm" class="modal-form">
        <input type="hidden" id="noteId">

        <!-- Title Field -->
        <div class="form-group">
          <label for="noteTitleInput">Title</label>
          <input type="text" id="noteTitleInput" placeholder="Note heading..." required maxlength="100">
        </div>

        <!-- Category & Color Selectors -->
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="noteCategorySelect">Category</label>
            <select id="noteCategorySelect">
              <option value="Personal">Personal</option>
              <option value="Work">Work</option>
              <option value="Ideas">Ideas</option>
              <option value="Study">Study</option>
            </select>
          </div>

          <div class="form-group flex-1">
            <label>Card Color</label>
            <div class="color-picker" id="colorPicker">
              <button type="button" class="color-dot active" data-color="indigo" style="background-color: #6366f1;" title="Indigo"></button>
              <button type="button" class="color-dot" data-color="emerald" style="background-color: #10b981;" title="Emerald"></button>
              <button type="button" class="color-dot" data-color="amber" style="background-color: #f59e0b;" title="Amber"></button>
              <button type="button" class="color-dot" data-color="rose" style="background-color: #f43f5e;" title="Rose"></button>
              <button type="button" class="color-dot" data-color="cyan" style="background-color: #06b6d4;" title="Cyan"></button>
            </div>
          </div>
        </div>

        <!-- Note Content -->
        <div class="form-group">
          <label for="noteContentInput">Content</label>
          <textarea id="noteContentInput" rows="6" placeholder="Write your thoughts, checklist, or details here..." required></textarea>
        </div>

        <!-- Pin toggle in modal -->
        <div class="form-checkbox">
          <label class="checkbox-container">
            <input type="checkbox" id="notePinnedInput">
            <span class="custom-checkbox"></span>
            <span class="checkbox-label">Pin this note to the top</span>
          </label>
        </div>

        <!-- Actions -->
        <div class="modal-actions">
          <button type="button" id="cancelModalBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="saveNoteBtn" class="btn btn-primary">Save Note</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card modal-confirm">
      <div class="confirm-icon-danger">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </div>
      <h3>Delete Note?</h3>
      <p>Are you sure you want to permanently delete "<span id="deleteNoteTitlePreview" class="highlight-text"></span>"? This action cannot be undone.</p>
      <div class="modal-actions">
        <button type="button" id="cancelDeleteBtn" class="btn btn-secondary">Keep Note</button>
        <button type="button" id="confirmDeleteBtn" class="btn btn-danger">Yes, Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- App Script -->
  <script src="js/app.js"></script>
</body>
</html>
